<svg width="1000" height="88" viewBox="0 0 1000 88" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#06060E"/><stop offset="100%" stop-color="#080818"/>
  </linearGradient>
  <linearGradient id="cs" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#0F0F1F"/><stop offset="100%" stop-color="#0B0B16"/>
  </linearGradient>
  <linearGradient id="ge" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#00B4D8" stop-opacity="0.60"/>
    <stop offset="50%"  stop-color="#FFFFFF"  stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#5856D6"  stop-opacity="0.10"/>
  </linearGradient>
  <linearGradient id="ts" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="cf" x="-12%" y="-20%" width="124%" height="140%"
    color-interpolation-filters="linearRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b1"/>
    <feOffset in="b1" dx="7" dy="7" result="od"/>
    <feFlood flood-color="#010104" flood-opacity="1" result="cd"/>
    <feComposite in="cd" in2="od" operator="in" result="sd"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="b2"/>
    <feOffset in="b2" dx="-7" dy="-7" result="ol"/>
    <feFlood flood-color="#161632" flood-opacity="0.58" result="cl"/>
    <feComposite in="cl" in2="ol" operator="in" result="sl"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" stitchTiles="stitch" result="tn"/>
    <feColorMatrix type="saturate" values="0" in="tn" result="gn"/>
    <feComposite in="gn" in2="SourceAlpha" operator="in" result="cn"/>
    <feComponentTransfer in="cn" result="dn"><feFuncA type="linear" slope="0.038"/></feComponentTransfer>
    <feMerge>
      <feMergeNode in="sd"/>
      <feMergeNode in="sl"/>
      <feMergeNode in="SourceGraphic"/>
      <feMergeNode in="dn"/>
    </feMerge>
  </filter>
</defs>
<rect width="1000" height="88" fill="url(#bg)"/>
<!-- Neomorphic card -->
<rect x="8" y="8" width="984" height="72" rx="16" fill="url(#cs)" filter="url(#cf)"/>
<!-- Glass layer -->
<rect x="8" y="8" width="984" height="72" rx="16"
  fill="#FFFFFF" fill-opacity="0.03" stroke="url(#ge)" stroke-width="1"/>
<rect x="8" y="8" width="984" height="2" rx="1" fill="url(#ts)"/>
  <rect x="44.2" y="49" width="151.5" height="22" rx="11"
    fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-opacity="0.32" stroke-width="0.8"/>
  <text x="120" y="64" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="10.5" font-weight="500" fill="#00B4D8" letter-spacing="0.2">BS AI · 3.81 CGPA</text>  <rect x="266.8" y="49" width="106.5" height="22" rx="11"
    fill="#5856D6" fill-opacity="0.12" stroke="#5856D6" stroke-opacity="0.32" stroke-width="0.8"/>
  <text x="320" y="64" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
