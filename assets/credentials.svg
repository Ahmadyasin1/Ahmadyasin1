    fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-opacity="0.32" stroke-width="0.8"/>
  <text x="476" y="64" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="10.5" font-weight="500" fill="#00B4D8" letter-spacing="0.2">Published Research</text>  <rect x="580.5" y="49" width="159.0" height="22" rx="11"
    fill="#5856D6" fill-opacity="0.12" stroke="#5856D6" stroke-opacity="0.32" stroke-width="0.8"/>
  <text x="660" y="64" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="10.5" font-weight="500" fill="#5856D6" letter-spacing="0.2">Hackathon Champion</text>  <rect x="770.8" y="49" width="166.5" height="22" rx="11"
    fill="#00B4D8" fill-opacity="0.12" stroke="#00B4D8" stroke-opacity="0.32" stroke-width="0.8"/>
  <text x="854" y="64" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="10.5" font-weight="500" fill="#00B4D8" letter-spacing="0.2">60+ Systems Shipped</text>
</svg>