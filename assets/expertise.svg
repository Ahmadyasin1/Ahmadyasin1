  <text x="297" y="136" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="300" fill="#8A8A8E" text-anchor="middle">LangGraph · Multi-Agent</text>

  <!-- CARD 3: Computer Vision -->
  <rect x="402" y="10" width="182" height="200" rx="18" fill="url(#cardFill)"/>
  <rect x="402" y="10" width="182" height="1.5" rx="1" fill="url(#topShine)"/>
  <rect x="402" y="10" width="182" height="200" rx="18" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
  <text x="493" y="75" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="30" text-anchor="middle">👁️</text>
