  <rect x="800" y="12" width="189" height="2.5" rx="1" fill="url(#ts)"/>
  <rect x="800" y="12" width="189" height="3.5" rx="1.5" fill="url(#wb)"/>
  <circle cx="895" cy="78" r="24" fill="url(#ig)" filter="url(#icn-glow)" opacity="0.92"/>
  <text x="895" y="83" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">API</text>
  <text x="895" y="130" text-anchor="middle"
