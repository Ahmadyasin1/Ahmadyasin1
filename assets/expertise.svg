  <!-- CARD 6: Automation -->
  <rect x="990" y="10" width="200" height="200" rx="18" fill="url(#cardFill)"/>
  <rect x="990" y="10" width="200" height="1.5" rx="1" fill="url(#topShine)"/>
  <rect x="990" y="10" width="200" height="200" rx="18" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
  <text x="1090" y="75" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="30" text-anchor="middle">⚙️</text>
  <text x="1090" y="115" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Automation</text>
  <text x="1090" y="136" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="300" fill="#8A8A8E" text-anchor="middle">n8n · VAPI · Workflows</text>
</svg>
