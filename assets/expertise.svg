  <rect x="598" y="10" width="182" height="200" rx="18" fill="url(#cardFill)"/>
  <rect x="598" y="10" width="182" height="1.5" rx="1" fill="url(#topShine)"/>
  <rect x="598" y="10" width="182" height="200" rx="18" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
  <text x="689" y="75" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="30" text-anchor="middle">🎥</text>
  <text x="689" y="115" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
