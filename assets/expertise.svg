  <circle cx="698" cy="78" r="24" fill="url(#ig)" filter="url(#icn-glow)" opacity="0.92"/>
  <text x="698" y="83" text-anchor="middle"
    font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
