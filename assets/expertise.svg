<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#04071A"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="topShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <!-- Card helper macro (manual repeat) -->
  <!-- CARD 1: Generative AI -->
  <rect x="10" y="10" width="182" height="200" rx="18" fill="url(#cardFill)"/>
  <rect x="10" y="10" width="182" height="1.5" rx="1" fill="url(#topShine)"/>
  <rect x="10" y="10" width="182" height="200" rx="18" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
  <text x="101" y="75" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="30" text-anchor="middle">🤖</text>
  <text x="101" y="115" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Generative AI</text>
  <text x="101" y="136" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
    font-size="11" font-weight="300" fill="#8A8A8E" text-anchor="middle">LLM · RAG · Agents</text>

  <!-- CARD 2: AI Agents -->
  <rect x="206" y="10" width="182" height="200" rx="18" fill="url(#cardFill)"/>
  <rect x="206" y="10" width="182" height="1.5" rx="1" fill="url(#topShine)"/>
  <rect x="206" y="10" width="182" height="200" rx="18" fill="none" stroke="url(#cardBorder)" stroke-width="1"/>
  <text x="297" y="75" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="30" text-anchor="middle">🧩</text>
  <text x="297" y="115" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif"
