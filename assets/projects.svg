<svg width="1200" height="297" viewBox="0 0 1200 297" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#06060E"/><stop offset="100%" stop-color="#080818"/>
  </linearGradient>
  <linearGradient id="cs" x1="10%" y1="0%" x2="90%" y2="100%">
    <stop offset="0%" stop-color="#0F0F1F"/><stop offset="100%" stop-color="#0B0B16"/>
  </linearGradient>
  <linearGradient id="gf" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.068"/>
    <stop offset="45%"  stop-color="#FFFFFF" stop-opacity="0.030"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.008"/>
  </linearGradient>
  <linearGradient id="ge" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#00B4D8" stop-opacity="0.70"/>
    <stop offset="18%"  stop-color="#FFFFFF"  stop-opacity="0.24"/>
    <stop offset="55%"  stop-color="#5856D6"  stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#00B4D8"  stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="ts" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="32%"  stop-color="#FFFFFF" stop-opacity="0.20"/>
    <stop offset="68%"  stop-color="#FFFFFF" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="wb" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#0096C7" stop-opacity="0"/>
    <stop offset="30%"  stop-color="#00B4D8">
      <animate attributeName="stop-color" dur="4s" repeatCount="indefinite"
        values="#00B4D8;#90E0EF;#5856D6;#00B4D8"/>
    </stop>
    <stop offset="70%"  stop-color="#5856D6">
      <animate attributeName="stop-color" dur="4s" repeatCount="indefinite"
        values="#5856D6;#00B4D8;#90E0EF;#5856D6"/>
    </stop>
    <stop offset="100%" stop-color="#5856D6" stop-opacity="0"/>
  </linearGradient>
  <filter id="bg-blur" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="55"/>
  </filter>
  <filter id="cf" x="-12%" y="-12%" width="124%" height="124%"
    color-interpolation-filters="linearRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="b1"/>
    <feOffset in="b1" dx="10" dy="10" result="od"/>
    <feFlood flood-color="#010104" flood-opacity="1" result="cd"/>
    <feComposite in="cd" in2="od" operator="in" result="sd"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="b2"/>
    <feOffset in="b2" dx="-10" dy="-10" result="ol"/>
    <feFlood flood-color="#161632" flood-opacity="0.62" result="cl"/>
    <feComposite in="cl" in2="ol" operator="in" result="sl"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4"
      stitchTiles="stitch" result="tn"/>
    <feColorMatrix type="saturate" values="0" in="tn" result="gn"/>
    <feComposite in="gn" in2="SourceAlpha" operator="in" result="cn"/>
    <feComponentTransfer in="cn" result="dn">
      <feFuncA type="linear" slope="0.040"/>
    </feComponentTransfer>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="sf"/>
    <feSpecularLighting in="sf" surfaceScale="3" specularConstant="0.5"
      specularExponent="22" lighting-color="#FFFFFF" result="sp">
      <fePointLight x="80" y="40" z="180"/>
    </feSpecularLighting>
    <feComposite in="sp" in2="SourceAlpha" operator="in" result="spc"/>
    <feComponentTransfer in="spc" result="spd">
      <feFuncA type="linear" slope="0.10"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="sd"/>
      <feMergeNode in="sl"/>
      <feMergeNode in="SourceGraphic"/>
      <feMergeNode in="dn"/>
      <feMergeNode in="spd"/>
    </feMerge>
  </filter>
</defs>
