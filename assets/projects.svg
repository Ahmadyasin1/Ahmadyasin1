<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="1280" height="520" role="img" aria-label="Selected projects: Detectra AI, Nexariza Cortex, NexarizaFlow"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBEFC9"/><stop offset=".45" stop-color="#D9B26B"/><stop offset="1" stop-color="#8E6B2F"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08151D"/><stop offset="1" stop-color="#03070C"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E2B0" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#5CE1E6" stop-opacity=".5"/></linearGradient>
<filter id="neo" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="7" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".7"/><feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#5CE1E6" flood-opacity=".08"/></filter></defs><style>
.sf{font-family:-apple-system,'SF Pro Display','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif} .sr{font-family:'Didot','Bodoni 72','Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.fw{stroke-dasharray:6 8;animation:fw 2.4s linear infinite}@keyframes fw{to{stroke-dashoffset:-14}}</style><rect x="20" y="20" width="740" height="480" rx="28" fill="url(#bg)" filter="url(#neo)"/><rect x="20" y="20" width="740" height="480" rx="28" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.4"/><path d="M48 21.5 H732" stroke="#fff" stroke-opacity=".35" stroke-width="1"/><rect x="780" y="20" width="480" height="230" rx="28" fill="url(#bg)" filter="url(#neo)"/><rect x="780" y="20" width="480" height="230" rx="28" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.4"/><path d="M808 21.5 H1232" stroke="#fff" stroke-opacity=".35" stroke-width="1"/><rect x="780" y="270" width="480" height="230" rx="28" fill="url(#bg)" filter="url(#neo)"/><rect x="780" y="270" width="480" height="230" rx="28" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.4"/><path d="M808 271.5 H1232" stroke="#fff" stroke-opacity=".35" stroke-width="1"/><text class="sr" x="64" y="90" font-size="44" fill="url(#gold)">Detectra AI</text><text class="sf" x="64" y="120" font-size="16" fill="#5CE1E6">Final year project, multimodal video intelligence</text><text class="sf" x="236" y="195" text-anchor="end" font-size="14" fill="#EDE8DC">Vision: YOLOv8, ByteTrack</text><path class="fw" d="M256 190 C330 190 330 265 404 265" fill="none" stroke="#5CE1E6" stroke-opacity=".75" stroke-width="1.6"/><circle cx="256" cy="190" r="6" fill="#5CE1E6"/><text class="sf" x="236" y="245" text-anchor="end" font-size="14" fill="#EDE8DC">Speech: Whisper Large-v3</text><path class="fw" d="M256 240 C330 240 330 265 404 265" fill="none" stroke="#5CE1E6" stroke-opacity=".75" stroke-width="1.6"/><circle cx="256" cy="240" r="6" fill="#5CE1E6"/><text class="sf" x="236" y="295" text-anchor="end" font-size="14" fill="#EDE8DC">Audio: Librosa, PANNs</text><path class="fw" d="M256 290 C330 290 330 265 404 265" fill="none" stroke="#5CE1E6" stroke-opacity=".75" stroke-width="1.6"/><circle cx="256" cy="290" r="6" fill="#5CE1E6"/><text class="sf" x="236" y="345" text-anchor="end" font-size="14" fill="#EDE8DC">On-screen text: EasyOCR</text><path class="fw" d="M256 340 C330 340 330 265 404 265" fill="none" stroke="#5CE1E6" stroke-opacity=".75" stroke-width="1.6"/><circle cx="256" cy="340" r="6" fill="#5CE1E6"/><rect x="404" y="205" width="160" height="120" rx="18" fill="url(#glass)" stroke="url(#gold)" stroke-width="1.8"/><text class="sf" x="484" y="260" text-anchor="middle" font-size="15" font-weight="600" fill="#EDE8DC">Cross-modal</text><text class="sf" x="484" y="280" text-anchor="middle" font-size="15" font-weight="600" fill="#EDE8DC">transformer</text><path class="fw" d="M564 265 H650" stroke="#D9B26B" stroke-width="1.8" fill="none"/><circle cx="660" cy="265" r="8" fill="url(#gold)"/><text class="sf" x="660" y="298" text-anchor="middle" font-size="14" fill="#EDE8DC">RAG-ready</text><text class="sf" x="660" y="316" text-anchor="middle" font-size="14" fill="#EDE8DC">JSON output</text><text class="sf" x="64" y="416" font-size="17" fill="#EDE8DC" fill-opacity=".92">Fuses what a video shows, says and sounds like into one searchable timeline.</text><text class="sf" x="64" y="446" font-size="17" fill="#8FA6B0">INT8 quantized, packaged in Docker, stored in PostgreSQL JSONB.</text><text class="sr" x="824" y="88" font-size="32" fill="url(#gold)">Nexariza Cortex</text><text class="sf" x="824" y="116" font-size="15" fill="#5CE1E6">Architecture blueprint</text><text class="sf" x="824" y="154" font-size="16" fill="#EDE8DC" fill-opacity=".9">An agentic business operating system where AI</text><text class="sf" x="824" y="178" font-size="16" fill="#EDE8DC" fill-opacity=".9">employees run sales, support and operations</text><text class="sf" x="824" y="202" font-size="16" fill="#EDE8DC" fill-opacity=".9">as one coordinated team.</text><text class="sr" x="824" y="338" font-size="32" fill="url(#gold)">NexarizaFlow</text><text class="sf" x="824" y="366" font-size="15" fill="#5CE1E6">Self-hosted product</text><text class="sf" x="824" y="404" font-size="16" fill="#EDE8DC" fill-opacity=".9">Browser extension platform with a FastAPI and</text><text class="sf" x="824" y="428" font-size="16" fill="#EDE8DC" fill-opacity=".9">SQLite backend and an admin dashboard.</text></svg>