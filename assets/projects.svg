<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="430" viewBox="0 0 1200 430"><style>text{font-family:'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif}</style><defs>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8A6A25"/><stop offset=".5" stop-color="#F6E3A8"/><stop offset="1" stop-color="#C9A24B"/></linearGradient>
<linearGradient id="plat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#9AA6BD"/></linearGradient>
<linearGradient id="bord" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9A24B" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#2E9BFF" stop-opacity=".45"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity=".015"/></linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff3c4" stop-opacity="0"/><stop offset=".5" stop-color="#fff3c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff3c4" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter></defs><g transform="translate(12 14)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" keyTimes="0;.5;1" dur="5.0s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><rect width="700" height="380" rx="22" fill="#0A0D16"/><rect width="700" height="380" rx="22" fill="url(#glass)" stroke="url(#bord)" stroke-width="1.2"/><rect width="700" height="380" rx="22" fill="none" stroke="#F6E3A8" stroke-width="1.6" stroke-dasharray="110 2160" stroke-linecap="round" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-2270" dur="8s" begin="0.0s" repeatCount="indefinite"/></rect><text x="28" y="44" font-size="13" letter-spacing="4" fill="#C9A24B">FINAL YEAR PROJECT</text><text x="28" y="90" font-size="40" font-weight="800" fill="url(#plat)">Detectra AI</text><text x="236" y="90" font-size="17" fill="#8F9AB0">Multimodal video intelligence</text><g transform="translate(28 128)"><rect width="296" height="36" rx="10" fill="#fff" fill-opacity=".04"/><rect width="3" height="36" rx="1.5" fill="url(#gold)"/><text x="16" y="23" font-size="14" fill="#F2F4F8"><tspan fill="#C9A24B" font-weight="700">Vision</tspan>  YOLOv8, ByteTrack</text></g><g transform="translate(338 128)"><rect width="296" height="36" rx="10" fill="#fff" fill-opacity=".04"/><rect width="3" height="36" rx="1.5" fill="url(#gold)"/><text x="16" y="23" font-size="14" fill="#F2F4F8"><tspan fill="#C9A24B" font-weight="700">Speech</tspan>  Whisper Large-v3</text></g><g transform="translate(28 174)"><rect width="296" height="36" rx="10" fill="#fff" fill-opacity=".04"/><rect width="3" height="36" rx="1.5" fill="url(#gold)"/><text x="16" y="23" font-size="14" fill="#F2F4F8"><tspan fill="#C9A24B" font-weight="700">Audio</tspan>  Librosa, PANNs</text></g><g transform="translate(338 174)"><rect width="296" height="36" rx="10" fill="#fff" fill-opacity=".04"/><rect width="3" height="36" rx="1.5" fill="url(#gold)"/><text x="16" y="23" font-size="14" fill="#F2F4F8"><tspan fill="#C9A24B" font-weight="700">On-screen text</tspan>  EasyOCR</text></g><line x1="28" y1="250" x2="672" y2="250" stroke="#2E9BFF" stroke-opacity=".35" stroke-dasharray="3 6"/><circle r="5" cy="250" fill="#F6E3A8" filter="url(#glow)"><animate attributeName="cx" values="28;672" dur="3.2s" repeatCount="indefinite"/></circle><circle r="3" cy="250" fill="#fff"><animate attributeName="cx" values="28;672" dur="3.2s" repeatCount="indefinite"/></circle><g transform="translate(28 270)"><rect width="164" height="30" rx="15" fill="none" stroke="url(#gold)"/><text x="82" y="20" font-size="13" text-anchor="middle" fill="#F6E3A8">Cross-modal transformer</text></g><g transform="translate(204 270)"><rect width="164" height="30" rx="15" fill="none" stroke="url(#gold)"/><text x="82" y="20" font-size="13" text-anchor="middle" fill="#F6E3A8">RAG-ready</text></g><g transform="translate(380 270)"><rect width="164" height="30" rx="15" fill="none" stroke="url(#gold)"/><text x="82" y="20" font-size="13" text-anchor="middle" fill="#F6E3A8">JSON output</text></g><text x="28" y="336" font-size="14" fill="#B7C0D2">Fuses what a video shows, says and sounds like into one searchable timeline.</text><text x="28" y="358" font-size="14" fill="#B7C0D2">INT8 quantized, packaged in Docker, stored in PostgreSQL JSONB.</text></g></g><g transform="translate(736 14)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" keyTimes="0;.5;1" dur="5.8s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><rect width="452" height="178" rx="22" fill="#0A0D16"/><rect width="452" height="178" rx="22" fill="url(#glass)" stroke="url(#bord)" stroke-width="1.2"/><rect width="452" height="178" rx="22" fill="none" stroke="#F6E3A8" stroke-width="1.6" stroke-dasharray="110 1260" stroke-linecap="round" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-1370" dur="9s" begin="0.9s" repeatCount="indefinite"/></rect><text x="28" y="40" font-size="12" letter-spacing="4" fill="#C9A24B">ARCHITECTURE BLUEPRINT</text><text x="28" y="76" font-size="26" font-weight="800" fill="url(#plat)">Nexariza Cortex</text><text x="28" y="108" font-size="14" fill="#8F9AB0">An agentic business operating system where AI</text><text x="28" y="130" font-size="14" fill="#8F9AB0">employees run sales, support and operations</text><text x="28" y="152" font-size="14" fill="#8F9AB0">as one coordinated team.</text></g></g><g transform="translate(736 216)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" keyTimes="0;.5;1" dur="6.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/><rect width="452" height="178" rx="22" fill="#0A0D16"/><rect width="452" height="178" rx="22" fill="url(#glass)" stroke="url(#bord)" stroke-width="1.2"/><rect width="452" height="178" rx="22" fill="none" stroke="#F6E3A8" stroke-width="1.6" stroke-dasharray="110 1260" stroke-linecap="round" opacity=".9"><animate attributeName="stroke-dashoffset" from="0" to="-1370" dur="10s" begin="1.8s" repeatCount="indefinite"/></rect><text x="28" y="40" font-size="12" letter-spacing="4" fill="#C9A24B">SELF-HOSTED PRODUCT</text><text x="28" y="76" font-size="26" font-weight="800" fill="url(#plat)">NexarizaFlow</text><text x="28" y="108" font-size="14" fill="#8F9AB0">Browser extension platform with a FastAPI and</text><text x="28" y="130" font-size="14" fill="#8F9AB0">SQLite backend and an admin dashboard.</text></g></g></svg>