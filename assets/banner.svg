<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#04071A"/>
    </linearGradient>

    <!-- Ambient glow left -->
    <radialGradient id="glow1" cx="20%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Ambient glow right -->
    <radialGradient id="glow2" cx="82%" cy="38%" r="38%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft bottom glow -->
    <radialGradient id="glow3" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass panel fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Glass border -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#5E5CE6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Top shine highlight -->
    <linearGradient id="topShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0A84FF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#5E5CE6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </linearGradient>

    <!-- Stats separator -->
    <linearGradient id="statSep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom edge glow bar -->
    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0A84FF" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#5E5CE6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow1)"/>
  <rect width="1200" height="380" fill="url(#glow2)"/>
  <rect width="1200" height="380" fill="url(#glow3)"/>

  <!-- ── Glass Card ── -->
  <rect x="32" y="24" width="1136" height="332" rx="22" fill="url(#glassFill)"/>
  <!-- Top shine -->
  <rect x="32" y="24" width="1136" height="1.5" rx="1" fill="url(#topShine)"/>
  <!-- Border -->
  <rect x="32" y="24" width="1136" height="332" rx="22" fill="none" stroke="url(#glassBorder)" stroke-width="1"/>

  <!-- ── Corner accent dots ── -->
  <circle cx="52" cy="44" r="2.5" fill="#0A84FF" fill-opacity="0.5"/>
  <circle cx="1148" cy="44" r="2.5" fill="#5E5CE6" fill-opacity="0.5"/>
  <circle cx="52" cy="336" r="2.5" fill="#5E5CE6" fill-opacity="0.5"/>
  <circle cx="1148" cy="336" r="2.5" fill="#0A84FF" fill-opacity="0.5"/>

  <!-- ── Name ── -->
  <text x="600" y="140"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">
    Ahmad Yasin
  </text>

  <!-- ── Title ── -->
  <text x="600" y="185"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="19" font-weight="300" fill="#8A8A8E" text-anchor="middle" letter-spacing="0.5">
    AI Engineer · Founder &amp; CEO, Nexariza AI · Lahore, Pakistan
  </text>

  <!-- ── Accent divider ── -->
  <line x1="430" y1="212" x2="770" y2="212" stroke="url(#accentLine)" stroke-width="1"/>

  <!-- ── Stat: Left ── -->
  <text x="300" y="264"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    60+
  </text>
  <text x="300" y="292"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12.5" font-weight="400" fill="#8A8A8E" text-anchor="middle" letter-spacing="0.4">
    Production AI Systems
  </text>

  <!-- Separator left -->
  <line x1="490" y1="248" x2="490" y2="302" stroke="url(#statSep)" stroke-width="1"/>

  <!-- ── Stat: Center ── -->
  <text x="600" y="264"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    4+
  </text>
  <text x="600" y="292"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12.5" font-weight="400" fill="#8A8A8E" text-anchor="middle" letter-spacing="0.4">
    Years Engineering
  </text>

  <!-- Separator right -->
  <line x1="710" y1="248" x2="710" y2="302" stroke="url(#statSep)" stroke-width="1"/>

  <!-- ── Stat: Right ── -->
  <text x="900" y="264"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
    #1
  </text>
  <text x="900" y="292"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="12.5" font-weight="400" fill="#8A8A8E" text-anchor="middle" letter-spacing="0.4">
    National AI Hackathon 2024
  </text>

  <!-- ── Bottom glow bar ── -->
  <rect x="32" y="352" width="1136" height="2" rx="1" fill="url(#bottomBar)" fill-opacity="0.7"/>

  <!-- ── Watermark ── -->
  <text x="600" y="370"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="10.5" font-weight="300" fill="#FFFFFF" fill-opacity="0.18" text-anchor="middle" letter-spacing="2">
    NEXARIZA AI
  </text>
</svg>
