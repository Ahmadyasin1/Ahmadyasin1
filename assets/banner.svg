<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Ahmad Yasin, Founder and CEO of Nexariza AI"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBEFC9"/><stop offset=".45" stop-color="#D9B26B"/><stop offset="1" stop-color="#8E6B2F"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#08151D"/><stop offset="1" stop-color="#03070C"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset="1" stop-color="#fff" stop-opacity=".02"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4E2B0" stop-opacity=".8"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#5CE1E6" stop-opacity=".5"/></linearGradient>
<filter id="neo" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="7" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".7"/><feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#5CE1E6" flood-opacity=".08"/></filter><filter id="caus" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="3" seed="7"><animate attributeName="baseFrequency" dur="26s" values="0.006 0.018;0.010 0.025;0.006 0.018" repeatCount="indefinite"/></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 .36  0 0 0 0 .88  0 0 0 0 .90  14 0 0 0 -6.6"/></filter>
<radialGradient id="glow" cx="1030" cy="220" r="480" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5CE1E6" stop-opacity=".30"/><stop offset="1" stop-color="#5CE1E6" stop-opacity="0"/></radialGradient>
<radialGradient id="orb" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#F2FDFF" stop-opacity=".95"/><stop offset=".28" stop-color="#5CE1E6" stop-opacity=".55"/><stop offset=".75" stop-color="#0A3442"/><stop offset="1" stop-color="#03141C"/></radialGradient>
<clipPath id="cl"><rect width="1280" height="440" rx="26"/></clipPath>
<filter id="blur"><feGaussianBlur stdDeviation="7"/></filter></defs><style>
.sf{font-family:-apple-system,'SF Pro Display','Inter','Segoe UI','Helvetica Neue',Arial,sans-serif} .sr{font-family:'Didot','Bodoni 72','Playfair Display','Cormorant Garamond',Georgia,'Times New Roman',serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.rp{fill:none;stroke:#5CE1E6;stroke-width:1.4;vector-effect:non-scaling-stroke;transform-box:fill-box;transform-origin:center;animation:rp 6s ease-out infinite;opacity:0}
@keyframes rp{0%{transform:scale(.55);opacity:.7}100%{transform:scale(2.3);opacity:0}}
.wv1{animation:wv 16s linear infinite}.wv2{animation:wv 24s linear infinite reverse}
@keyframes wv{to{transform:translateX(-1280px)}}
.fl{animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
</style><g clip-path="url(#cl)">
<rect width="1280" height="440" fill="url(#bg)"/>
<rect width="1280" height="440" filter="url(#caus)" opacity=".42"/>
<rect width="1280" height="440" fill="url(#glow)"/>
<circle class="rp" cx="1030" cy="220" r="100"/><circle class="rp" cx="1030" cy="220" r="100" style="animation-delay:2s"/><circle class="rp" cx="1030" cy="220" r="100" style="animation-delay:4s"/>
<path class="wv2" d="M0 406 Q160 384 320 406 T640 406 T960 406 T1280 406 T1600 406 T1920 406 T2240 406 T2560 406 V440 H0Z" fill="#5CE1E6" fill-opacity=".07"/>
<path class="wv1" d="M0 392 Q160 362 320 392 T640 392 T960 392 T1280 392 T1600 392 T1920 392 T2240 392 T2560 392 V440 H0Z" fill="#5CE1E6" fill-opacity=".10"/>
<ellipse cx="1030" cy="352" rx="84" ry="10" fill="#5CE1E6" opacity=".35" filter="url(#blur)"/>
<g class="fl"><circle cx="1030" cy="220" r="92" fill="url(#orb)"/><circle cx="1030" cy="220" r="92" fill="none" stroke="url(#gold)" stroke-width="2.5"/><circle cx="1030" cy="220" r="82" fill="none" stroke="#fff" stroke-opacity=".12"/>
<ellipse cx="998" cy="168" rx="42" ry="19" fill="#fff" opacity=".28" transform="rotate(-28 998 168)"/>
<text class="sr" x="1030" y="254" text-anchor="middle" font-size="92" fill="url(#gold)">N</text></g>
<rect x="64" y="72" width="780" height="300" rx="30" fill="url(#bg)" filter="url(#neo)"/><rect x="64" y="72" width="780" height="300" rx="30" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.4"/><path d="M94 73.5 H814" stroke="#fff" stroke-opacity=".35" stroke-width="1"/>
<text class="sf" x="112" y="134" font-size="19" fill="#BFD3DA" letter-spacing=".6">Founder and CEO, Nexariza AI</text>
<text class="sf" x="112" y="164" font-size="18" fill="#5CE1E6">AI Engineer and Systems Architect</text>
<text class="sr" x="108" y="256" font-size="100" fill="url(#gold)" letter-spacing="-1">Ahmad Yasin</text>
<path d="M112 284 H232" stroke="url(#gold)" stroke-width="2"/>
<text class="sf" x="112" y="322" font-size="23" fill="#EDE8DC" fill-opacity=".92">I build AI systems that hold up in production</text>
<text class="sf" x="112" y="351" font-size="23" fill="#EDE8DC" fill-opacity=".92">and pay for themselves.</text>
</g>
